[project]
name = "aptrades2-backend"
version = "0.1.0"
description = "APTRADES v2 Flask backend skeleton"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4.0",
  "flask-cors>=6.0,<7.0",
  "gunicorn>=23.0,<24.0",
  "requests>=2.32,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
