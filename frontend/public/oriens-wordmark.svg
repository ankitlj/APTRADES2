<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oriensWordGradient" x1="260" y1="48" x2="990" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16859A"/>
      <stop offset="0.48" stop-color="#116A8A"/>
      <stop offset="1" stop-color="#0B365D"/>
    </linearGradient>
    <linearGradient id="oriensTagGradient" x1="258" y1="170" x2="848" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#87603D"/>
      <stop offset="0.48" stop-color="#AA7E52"/>
      <stop offset="1" stop-color="#6D4A2B"/>
    </linearGradient>
    <filter id="oriensGlow" x="0" y="0" width="1200" height="280" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#8EE9FF" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#oriensGlow)">
    <image href="/oriens-mark.svg" x="20" y="38" width="152" height="152" preserveAspectRatio="xMidYMid meet"/>
    <text x="228" y="128" fill="url(#oriensWordGradient)" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="700" letter-spacing="10">ORIENS</text>
    <text x="230" y="190" fill="url(#oriensTagGradient)" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600" letter-spacing="7">TRACK | TRADE | TRIUMPH</text>
  </g>
</svg>
